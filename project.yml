# Il progetto Xcode si genera da qui con XcodeGen su Codemagic (Xcode 27 SDK, compatibile da iOS 26.1 a iOS 27+).
name: Domus
options:
  bundleIdPrefix: it.domus
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Domus:
    type: application
    platform: iOS
    sources:
      - path: Domus
        excludes:
          - Risorse/**
          - Info.plist
      - path: Domus/Risorse
        buildPhase: resources
      - path: Condiviso
    dependencies:
      - target: DomusWidget
        embed: true
    info:
      path: Domus/Info.plist
      properties:
        CFBundleDisplayName: Domus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Sfondo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Serve a Domus per trovare e controllare direttamente sulla tua rete Wi-Fi le lampadine e le strisce LED Magic Home e Tuya, senza ritardi.
        NSBonjourServices:
          - _http._tcp
          - _tuya._tcp
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: it.domus.app
            CFBundleURLSchemes:
              - domus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.domus.app
  DomusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DomusWidget
        excludes:
          - Info.plist
      - path: Condiviso
    info:
      path: DomusWidget/Info.plist
      properties:
        CFBundleDisplayName: Domus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Permette ai widget di Domus di commutare rapidamente le luci sulla rete Wi-Fi locale.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.domus.app.widget
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
schemes:
  Domus:
    build:
      targets:
        Domus: all
